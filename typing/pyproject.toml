[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "types-pythago"
version = "0.1.0"
description = "Typing stubs for the Python modules of pythago: goaio, pythago_asgi and pythago_wsgi"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
classifiers = [
    "Typing :: Stubs Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/moriyoshi/pythago"

[tool.hatch.build.targets.wheel]
packages = [
    "goaio-stubs",
    "goaio_tls-stubs",
    "_goaio-stubs",
    "pythago_asgi-stubs",
    "_pythago_asgi-stubs",
    "pythago_wsgi-stubs",
    "_pythago_wsgi-stubs",
]

[tool.hatch.build.targets.sdist]
include = ["*-stubs/**/*.pyi", "README.md", "pyproject.toml"]
