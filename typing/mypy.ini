# Checks the annotated sources against the stubs (ci/typecheck.sh). Not packaged.
[mypy]
python_version = 3.13
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
strict_equality = True

# Third-party packages the benchmarks and the GPU checks use, not installed here.
[mypy-torch.*,vllm.*,uvicorn.*,fastapi.*,flask.*,starlette.*,pydantic.*,httpx.*,aiohttp.*]
ignore_missing_imports = True

# examples/hello's Go module (py.Config.Modules), which has no stub.
[mypy-host]
ignore_missing_imports = True
