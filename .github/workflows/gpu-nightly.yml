# GPU tier (PLAN.md §13 M4): torch through pythago-env environments, each check
# also run under the stock interpreter as a control. Needs a self-hosted runner with an
# NVIDIA GPU and driver (labels: self-hosted, linux, gpu).
name: gpu-nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
# The token only reads public release metadata (api.github.com) and checks out the code.
permissions:
  contents: read

jobs:
  gpu:
    strategy:
      fail-fast: false
      matrix:
        variant: [gil, ft]
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - name: GPU tier
        run: ci/gpu.sh ${{ matrix.variant }}
        env:
          PYTHAGO_GPU_VLLM: "0"
          GITHUB_TOKEN: ${{ github.token }}
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-logs-${{ matrix.variant }}
          path: ~/.cache/pythago-ci/gpu-*.log
